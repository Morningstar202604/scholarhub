# ScholarHUB dev stack — Postgres + backend.
#
# Usage:
#   1. cp apps/backend/.env.example .env   # then fill in real secrets
#   2. docker compose -f infra/docker-compose.yml up --build
#   3. open http://localhost:8000/docs
#
# The backend service reads SCHOLARHUB_* vars from the project-root ``.env``
# (env_file below). Only ``SCHOLARHUB_DATABASE_URL`` is overridden here so
# the app talks to the ``postgres`` service instead of ``localhost``.
#
# Run one-off migrations without starting the server:
#   docker compose -f infra/docker-compose.yml run --rm \
#     backend alembic upgrade head

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: scholarhub
      POSTGRES_USER: scholarhub
      # Dev-only default; override via SCHOLARHUB_DB_PASSWORD in .env (compose reads it).
      POSTGRES_PASSWORD: ${SCHOLARHUB_DB_PASSWORD:-scholarhub_dev}
    # One-time init: create the restricted app role + grant it access.
    # POSTGRES_USER (scholarhub) is a superuser used only for DDL/migrations;
    # the backend connects as scholarhub_app so RLS is actually enforced
    # (PostgreSQL bypasses RLS for superusers and table owners).
    volumes:
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/01-create-app-role.sql:ro
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scholarhub"]
      interval: 5s
      timeout: 3s
      retries: 10

  meilisearch:
    image: getmeili/meilisearch:v1.12
    environment:
      MEILI_MASTER_KEY: scholarhub_dev_meili_key
      MEILI_NO_ANALYTICS: "true"
    ports:
      - "7700:7700"
    volumes:
      - meilisearch_data:/meili_data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:7700/health | grep -q 'status.*available'"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ..
      dockerfile: infra/Dockerfile.backend
    env_file:
      - ../.env
    environment:
      # Override the .env's localhost URL to point at the compose service.
      # The backend connects as the restricted app role so RLS is enforced;
      # migrations run as the superuser (scholarhub) before app start.
      SCHOLARHUB_DATABASE_URL: postgresql+asyncpg://scholarhub_app:scholarhub_app_pw@postgres:5432/scholarhub
      SCHOLARHUB_MEILISEARCH_URL: http://meilisearch:7700
      SCHOLARHUB_MEILISEARCH_API_KEY: scholarhub_dev_meili_key
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    # Migrations run as the superuser (scholarhub) so DDL succeeds;
    # the app then starts as the restricted role (scholarhub_app) so
    # RLS is actually enforced at runtime.
    command: >
      sh -c "
        SCHOLARHUB_DATABASE_URL=postgresql+asyncpg://scholarhub:${SCHOLARHUB_DB_PASSWORD:-scholarhub_dev}@postgres:5432/scholarhub
        alembic upgrade head &&
        export SCHOLARHUB_DATABASE_URL=postgresql+asyncpg://scholarhub_app:${SCHOLARHUB_APP_DB_PASSWORD:-scholarhub_app_pw}@postgres:5432/scholarhub
        uvicorn app.main:app --host 0.0.0.0 --port 8000
      "
    restart: unless-stopped

volumes:
  pgdata:
  meilisearch_data:
