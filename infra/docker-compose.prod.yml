# ScholarHUB production stack — Postgres + Meilisearch + Backend + Frontend + Caddy.
#
# Prerequisites:
#   1. A server with Docker + Docker Compose installed.
#   2. DNS A record pointing your domain to the server's IP.
#   3. A proper .env file with real secrets (see apps/backend/.env.example).
#
# Usage:
#   cp .env.example .env        # fill in real secrets
#   docker compose -f infra/docker-compose.prod.yml up -d
#   # Caddy auto-provisions Let's Encrypt certs for your domain.
#
# Upgrade:
#   docker compose -f infra/docker-compose.prod.yml pull
#   docker compose -f infra/docker-compose.prod.yml up -d

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: scholarhub
      POSTGRES_USER: scholarhub
      POSTGRES_PASSWORD: ${SCHOLARHUB_DB_PASSWORD:-scholarhub_dev}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scholarhub"]
      interval: 10s
      timeout: 5s
      retries: 5

  meilisearch:
    image: getmeili/meilisearch:v1.12
    environment:
      MEILI_MASTER_KEY: ${SCHOLARHUB_MEILISEARCH_API_KEY:-scholarhub_prod_meili_key}
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meilisearch_data:/meili_data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:7700/health | grep -q 'status.*available'"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ..
      dockerfile: infra/Dockerfile.backend
    env_file:
      - ../.env
    environment:
      SCHOLARHUB_DATABASE_URL: postgresql+asyncpg://scholarhub:${SCHOLARHUB_DB_PASSWORD:-scholarhub_dev}@postgres:5432/scholarhub
      SCHOLARHUB_MEILISEARCH_URL: http://meilisearch:7700
      SCHOLARHUB_MEILISEARCH_API_KEY: ${SCHOLARHUB_MEILISEARCH_API_KEY:-scholarhub_prod_meili_key}
      SCHOLARHUB_ENVIRONMENT: production
    depends_on:
      postgres:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    image: nginx:alpine
    volumes:
      - ../apps/frontend/dist:/usr/share/nginx/html:ro
      - ./nginx.frontend.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

volumes:
  pgdata:
  meilisearch_data:
  caddy_data:
  caddy_config: