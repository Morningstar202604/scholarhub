version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/apps/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
    auto-merge:
      enabled: true
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "backend"
      - "auto-merge"

  - package-ecosystem: "npm"
    directory: "/apps/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
    auto-merge:
      enabled: true
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "frontend"
      - "auto-merge"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "github-actions"

  - package-ecosystem: "docker"
    directory: "/infra/docker"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "docker"