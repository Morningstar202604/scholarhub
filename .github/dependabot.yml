version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/apps/backend"
    schedule:
      interval: "weekly"
    auto-merge:
      enabled: true
    open-pull-requests-limit: 5
  - package-ecosystem: "npm"
    directory: "/apps/frontend"
    schedule:
      interval: "weekly"
    auto-merge:
      enabled: true
    open-pull-requests-limit: 5
