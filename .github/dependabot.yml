version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        update-types:
        - patch
        - minor
        - major
  - package-ecosystem: pip
    directory: /apps/backend
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      pip-group:
        update-types:
        - patch
        - minor
        - major
