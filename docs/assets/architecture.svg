<?xml version="1.0" encoding="UTF-8"?>
<!--
  ScholarHUB 架构图（v2）。

  相比旧版的修正：
    1. 补齐模块网格 —— 旧图只有 10 个格子且漏掉 doi / recommendations 名挤；
       现按 app/modules/__init__.py 的 ENABLED_MODULES 列出全部 11 个模块 + core。
    2. TypeScript 5.7 → 5.9。
    3. Redis 由"规划中"改为真实状态（已用于限流，带内存降级）。
    4. 所有文字重新排版，长模块名不再顶框；配色与 S logo 统一为靛蓝紫。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="ScholarHUB 系统架构">
  <defs>
    <linearGradient id="fe-fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EEF2FF"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="be-fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E0E7FF"/>
      <stop offset="100%" stop-color="#F5F3FF"/>
    </linearGradient>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6366F1"/>
    </marker>
    <style>
      .h1    { font: 700 19px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #1E1B4B; }
      .sub   { font: 400 12px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #64748B; }
      .h2    { font: 700 13.5px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #312E81; }
      .tech  { font: 400 11px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #6366F1; }
      .mod   { font: 600 12px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #1E1B4B; }
      .modd  { font: 400 10.5px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #64748B; }
      .chip  { font: 600 11px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #FFFFFF; }
      .edge  { font: 500 10.5px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #6366F1; }
    </style>
  </defs>

  <rect width="960" height="600" fill="#FFFFFF"/>

  <!-- 标题 -->
  <text x="480" y="36" text-anchor="middle" class="h1">ScholarHUB 系统架构</text>
  <text x="480" y="57" text-anchor="middle" class="sub">前端 SPA · 模块化后端 API · 双层租户隔离的 PostgreSQL</text>

  <!-- ============ 前端层 ============ -->
  <rect x="40" y="82" width="880" height="96" rx="14" fill="url(#fe-fill)" stroke="#C7D2FE"/>
  <text x="60" y="108" class="h2">前端 SPA · apps/frontend</text>
  <text x="60" y="126" class="tech">React 19 · TypeScript 5.9 · Vite 7 · TanStack Router + Query · Tailwind v4 · shadcn/ui</text>
  <g>
    <rect x="60"  y="138" width="118" height="30" rx="7" fill="#FFFFFF" stroke="#E0E7FF"/>
    <text x="119" y="157" text-anchor="middle" class="mod">路由 / 鉴权</text>
    <rect x="188" y="138" width="118" height="30" rx="7" fill="#FFFFFF" stroke="#E0E7FF"/>
    <text x="247" y="157" text-anchor="middle" class="mod">作者工作台</text>
    <rect x="316" y="138" width="118" height="30" rx="7" fill="#FFFFFF" stroke="#E0E7FF"/>
    <text x="375" y="157" text-anchor="middle" class="mod">审稿工作台</text>
    <rect x="444" y="138" width="118" height="30" rx="7" fill="#FFFFFF" stroke="#E0E7FF"/>
    <text x="503" y="157" text-anchor="middle" class="mod">阅读器</text>
    <rect x="572" y="138" width="118" height="30" rx="7" fill="#FFFFFF" stroke="#E0E7FF"/>
    <text x="631" y="157" text-anchor="middle" class="mod">阅读列表</text>
    <rect x="700" y="138" width="90"  height="30" rx="7" fill="#FFFFFF" stroke="#E0E7FF"/>
    <text x="745" y="157" text-anchor="middle" class="mod">通知</text>
    <rect x="800" y="138" width="100" height="30" rx="7" fill="#1E1B4B"/>
    <text x="850" y="157" text-anchor="middle" class="chip">admin 后台</text>
  </g>

  <!-- 连接：前端 → 后端 -->
  <line x1="480" y1="178" x2="480" y2="210" stroke="#6366F1" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="494" y="199" class="edge">HTTP + httpOnly Cookie</text>

  <!-- ============ 后端层 ============ -->
  <rect x="40" y="212" width="880" height="248" rx="14" fill="url(#be-fill)" stroke="#C7D2FE"/>
  <text x="60" y="238" class="h2">后端 API · apps/backend</text>
  <text x="60" y="256" class="tech">FastAPI 0.115 · SQLAlchemy 2 (async) · Pydantic 2 · JWT + refresh · structlog</text>

  <!-- core 条 -->
  <rect x="60" y="268" width="840" height="30" rx="8" fill="#312E81"/>
  <text x="74" y="287" class="chip">core — 租户 · 身份 · 角色 · 模块注册表 · 中间件 · 邮件 · 启动</text>

  <!-- 模块网格：11 个模块，4 列 × 3 行 -->
  <g>
    <!-- 行 1 -->
    <rect x="60"  y="310" width="198" height="42" rx="8" fill="#FFFFFF" stroke="#E0E7FF"/>
    <text x="74" y="327" class="mod">catalog</text>
    <text x="74" y="342" class="modd">文章元数据 · 学科 · 作者 · 卷期</text>

    <rect x="272" y="310" width="198" height="42" rx="8" fill="#FFFFFF" stroke="#E0E7FF"/>
    <text x="286" y="327" class="mod">submission</text>
    <text x="286" y="342" class="modd">投稿 → 编辑决策 → 录用</text>

    <rect x="484" y="310" width="198" height="42" rx="8" fill="#FFFFFF" stroke="#E0E7FF"/>
    <text x="498" y="327" class="mod">review</text>
    <text x="498" y="342" class="modd">同行评审 · 接稿 · 审稿报告</text>

    <rect x="696" y="310" width="204" height="42" rx="8" fill="#FFFFFF" stroke="#E0E7FF"/>
    <text x="710" y="327" class="mod">reader</text>
    <text x="710" y="342" class="modd">PDF 阅读 · 进度跨设备同步</text>

    <!-- 行 2 -->
    <rect x="60"  y="362" width="198" height="42" rx="8" fill="#FFFFFF" stroke="#E0E7FF"/>
    <text x="74" y="379" class="mod">export</text>
    <text x="74" y="394" class="modd">BibTeX / RIS / CSV / JSON</text>

    <rect x="272" y="362" width="198" height="42" rx="8" fill="#FFFFFF" stroke="#E0E7FF"/>
    <text x="286" y="379" class="mod">library</text>
    <text x="286" y="394" class="modd">个人阅读列表</text>

    <rect x="484" y="362" width="198" height="42" rx="8" fill="#FFFFFF" stroke="#E0E7FF"/>
    <text x="498" y="379" class="mod">follows</text>
    <text x="498" y="394" class="modd">作者 / 学科订阅 · 通知扇出</text>

    <rect x="696" y="362" width="204" height="42" rx="8" fill="#FFFFFF" stroke="#E0E7FF"/>
    <text x="710" y="379" class="mod">notifications</text>
    <text x="710" y="394" class="modd">站内通知流 · 按用户隔离</text>

    <!-- 行 3 -->
    <rect x="60"  y="414" width="198" height="42" rx="8" fill="#FFFFFF" stroke="#E0E7FF"/>
    <text x="74" y="431" class="mod">ingest</text>
    <text x="74" y="446" class="modd">Crossref · arXiv · PubMed · OpenAlex</text>

    <rect x="272" y="414" width="198" height="42" rx="8" fill="#FFFFFF" stroke="#E0E7FF"/>
    <text x="286" y="431" class="mod">recommendations</text>
    <text x="286" y="446" class="modd">基于阅读历史的个性化推荐</text>

    <rect x="484" y="414" width="198" height="42" rx="8" fill="#FFFFFF" stroke="#E0E7FF"/>
    <text x="498" y="431" class="mod">doi</text>
    <text x="498" y="446" class="modd">DataCite 注册 · 元数据查询</text>

    <!-- 说明格 -->
    <rect x="696" y="414" width="204" height="42" rx="8" fill="#EEF2FF" stroke="#C7D2FE" stroke-dasharray="4 3"/>
    <text x="710" y="431" class="mod">11 个领域模块</text>
    <text x="710" y="446" class="modd">+ core = 12 个顶层包</text>
  </g>

  <!-- 连接：后端 → 数据层 -->
  <line x1="480" y1="470" x2="480" y2="508" stroke="#6366F1" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="494" y="494" class="edge">SQLAlchemy 2 async</text>

  <!-- ============ 数据层 ============ -->
  <rect x="40" y="512" width="600" height="66" rx="12" fill="#FFFFFF" stroke="#A5B4FC"/>
  <text x="60" y="540" class="h2">PostgreSQL 17 · 主库 + Row Level Security</text>
  <text x="60" y="562" class="modd">SET LOCAL app.current_tenant_id —— 即便应用层漏写过滤，DB 也会拒掉跨租户行</text>

  <rect x="656" y="512" width="264" height="66" rx="12" fill="#FFFFFF" stroke="#A5B4FC"/>
  <text x="676" y="540" class="h2">Redis · 限流存储（可选）</text>
  <text x="676" y="562" class="modd">未配置时降级为内存实现，故障自动 fail-open</text>
</svg>
