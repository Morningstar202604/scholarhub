<?xml version="1.0" encoding="UTF-8"?>
<!--
  ScholarHUB logo mark —— 「S」纯字形版（favicon / 头像 / 单色场景）。

  与 logo.svg 的区别：
    - 去掉了圆角背景块，只保留 S 曲线，便于叠加在任意底色上或作单色使用。
    - 笔画使用 currentColor：放进 <span style="color:#4F46E5"> 或遮罩场景时自动跟随。
    - 需要带背景时用 logo.svg；需要透明/单色时用本文件。

  几何与 logo.svg 完全一致，保证两者并排时不出现形变差异。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-label="ScholarHUB mark">
  <path d="M 154 86
           C 154 68 139 62 120 62
           C 99 62 86 73 86 90
           C 86 106 99 114 120 120
           C 141 126 154 134 154 150
           C 154 167 141 178 120 178
           C 101 178 86 172 86 154"
        fill="none" stroke="#4F46E5" stroke-width="17"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
