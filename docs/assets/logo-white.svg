<?xml version="1.0" encoding="UTF-8"?>
<!--
  ScholarHUB 主标志 —— 「学术徽章」反白版
  与 logo.svg 同几何、同构图；用于深色背景（官网 Hero / 深色导航 / 深色印刷）。
  外环与文字反白，中央 S 用白色渐变，金色翻页角与引用星保留品牌点缀。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-label="ScholarHUB">
  <defs>
    <linearGradient id="shw-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E4C988"/>
      <stop offset="100%" stop-color="#C7A24B"/>
    </linearGradient>
    <linearGradient id="shw-white" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#C7D6E8"/>
    </linearGradient>
    <path id="shw-arc-top" d="M 46 120 A 74 74 0 0 1 194 120"/>
    <path id="shw-arc-bottom" d="M 194 120 A 74 74 0 0 1 46 120"/>
  </defs>

  <circle cx="120" cy="120" r="108" fill="none" stroke="#F2F6FA" stroke-width="8"/>
  <circle cx="120" cy="120" r="91" fill="none" stroke="url(#shw-gold)" stroke-width="2.8"/>

  <text font-family="Georgia,'Times New Roman',serif" font-size="21"
        font-weight="700" letter-spacing="4.4" fill="#FFFFFF">
    <textPath href="#shw-arc-top" startOffset="50%" text-anchor="middle">SCHOLARHUB</textPath>
  </text>
  <text font-family="Georgia,'Times New Roman',serif" font-size="11.2"
        letter-spacing="2.3" fill="#A9B7C9">
    <textPath href="#shw-arc-bottom" startOffset="50%" text-anchor="middle">OPEN SCHOLARLY PUBLISHING</textPath>
  </text>

  <path d="M 176 72
           C 176 54 158 44 120 44
           C 84 44 64 58 64 80
           C 64 100 80 110 106 116
           C 134 122 176 134 176 164
           C 176 188 156 196 120 196
           C 86 196 64 184 64 168"
        fill="none" stroke="url(#shw-white)" stroke-width="25"
        stroke-linecap="round" stroke-linejoin="round"/>

  <path d="M 132 184
           C 152 176 168 160 172 140
           C 164 164 148 176 124 180
           Z"
        fill="url(#shw-gold)"/>

  <path d="M 120 215 L 122.6 220.6 L 128.2 223.2 L 122.6 225.8 L 120 231.4 L 117.4 225.8 L 111.8 223.2 L 117.4 220.6 Z"
        fill="#E4C988"/>
</svg>
