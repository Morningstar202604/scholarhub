<?xml version="1.0" encoding="UTF-8"?>
<!--
  ScholarHUB 投稿-审稿-发表主流程图（v2）。

  相比旧版的修正：
    1. 旧图箭头大量交叉、穿过节点，"推到发表"被"已发表"节点覆盖 ——
       现改为单条水平主流程 + 一条明确的返修回路，箭头不再穿卡。
    2. 旧图右下半张大画布空白 —— 现在主流程横向铺满，底部加角色图例填充。
    3. 每个节点用颜色区分责任角色，底部图例说明配色含义。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 460" width="1080" height="460" role="img" aria-label="投稿审稿发表主流程">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16324F"/>
    </marker>
    <marker id="arw-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#F59E0B"/>
    </marker>
    <linearGradient id="node-live" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <style>
      .title { font: 700 19px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #1E1B4B; }
      .sub   { font: 400 12px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #64748B; }
      .node  { font: 600 12.5px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #FFFFFF; }
      .edge  { font: 600 10.5px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #16324F; }
      .leg   { font: 500 11px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #475569; }
      .legt  { font: 700 11px ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #1E1B4B; }
    </style>
  </defs>

  <rect width="1080" height="460" fill="#FFFFFF"/>

  <text x="540" y="36" text-anchor="middle" class="title">投稿 → 审稿 → 录用 → 发表 → 阅读</text>
  <text x="540" y="57" text-anchor="middle" class="sub">同一篇文章的生命周期，四类角色在一条流水线上协作</text>

  <!-- ============ 主流程（水平） ============ -->
  <!-- 节点宽度 150、间距 36；起点 x=48 -->
  <!-- 1 投稿 -->
  <rect x="48"  y="118" width="150" height="52" rx="10" fill="#16324F"/>
  <text x="123" y="149" text-anchor="middle" class="node">投递稿件</text>

  <!-- 2 分配 -->
  <rect x="234" y="118" width="150" height="52" rx="10" fill="#16324F"/>
  <text x="309" y="149" text-anchor="middle" class="node">分配审稿人</text>

  <!-- 3 审稿 -->
  <rect x="420" y="118" width="150" height="52" rx="10" fill="#16324F"/>
  <text x="495" y="149" text-anchor="middle" class="node">审稿人评审</text>

  <!-- 4 决策 -->
  <rect x="606" y="118" width="150" height="52" rx="10" fill="#16324F"/>
  <text x="681" y="149" text-anchor="middle" class="node">编辑裁决</text>

  <!-- 5 发表 -->
  <rect x="792" y="118" width="150" height="52" rx="10" fill="url(#node-live)"/>
  <text x="867" y="149" text-anchor="middle" class="node">发表公开</text>

  <!-- 主流程箭头 -->
  <g stroke="#16324F" stroke-width="1.8" marker-end="url(#arw)">
    <line x1="198" y1="144" x2="230" y2="144"/>
    <line x1="384" y1="144" x2="416" y2="144"/>
    <line x1="570" y1="144" x2="602" y2="144"/>
    <line x1="756" y1="144" x2="788" y2="144"/>
  </g>
  <g class="edge">
    <text x="214" y="136" text-anchor="middle">提交</text>
    <text x="400" y="136" text-anchor="middle">邀请</text>
    <text x="586" y="136" text-anchor="middle">报告</text>
    <text x="772" y="136" text-anchor="middle">录用</text>
  </g>

  <!-- ============ 返修回路（编辑裁决 → 作者修改 → 回到评审） ============ -->
  <path d="M 681 170 L 681 258 L 316 258"
        fill="none" stroke="#F59E0B" stroke-width="1.8"
        stroke-dasharray="6 4" marker-end="url(#arw-amber)"/>
  <rect x="424" y="238" width="196" height="20" rx="6" fill="#FFFFFF"/>
  <text x="522" y="252" text-anchor="middle" class="edge" fill="#B45309">大修 / 小修 → 作者上传修改稿</text>

  <!-- 右半区：发表后的读者动作 -->
  <rect x="792" y="226" width="150" height="52" rx="10" fill="#0EA5E9"/>
  <text x="867" y="257" text-anchor="middle" class="node">读者阅读 / 收藏</text>
  <path d="M 867 170 L 867 222" fill="none" stroke="#16324F" stroke-width="1.8" marker-end="url(#arw)"/>
  <text x="879" y="200" class="edge">发表后公开</text>

  <!-- ============ 底部角色图例 ============ -->
  <line x1="48" y1="312" x2="1032" y2="312" stroke="#E2E8F0" stroke-width="1"/>
  <text x="48" y="342" class="legt">角色分工</text>

  <g>
    <rect x="48"  y="358" width="14" height="14" rx="3" fill="#16324F"/>
    <text x="70"  y="370" class="leg">作者 / 编辑 / 审稿人 —— 投稿、分配、评审、裁决</text>

    <rect x="420" y="358" width="14" height="14" rx="3" fill="#F59E0B"/>
    <text x="442" y="370" class="leg">返修回路 —— 修改稿回到评审环节再次流转</text>

    <rect x="792" y="358" width="14" height="14" rx="3" fill="#10B981"/>
    <text x="814" y="370" class="leg">终态 —— 录用后公开</text>
  </g>
  <g>
    <rect x="48"  y="388" width="14" height="14" rx="3" fill="#0EA5E9"/>
    <text x="70"  y="400" class="leg">读者 —— 阅读、收藏、订阅、接收推荐</text>

    <rect x="420" y="388" width="14" height="14" rx="3" fill="#16324F"/>
    <text x="442" y="400" class="leg">主流程 —— 一步向前推进</text>

    <rect x="792" y="388" width="14" height="14" rx="3" fill="#64748B"/>
    <text x="814" y="400" class="leg">每一步都写审计日志</text>
  </g>
</svg>
