<?xml version="1.0" encoding="UTF-8"?>
<!--
  ScholarHUB logo —— 「S · 书页流转」标志。

  设计意图（唯美简约）：
    - 一条连续曲线构成字母 S，一笔成型，无任何多余元素。
    - 这条 S 同时是"翻动的书页边缘"：上下两个弧线开口，像书页被风掀起的瞬间。
    - 大面积留白，笔画粗细均匀，缩小到 24px 仍是一条清晰的 S。
    - 单一意象，不堆叠"书 + 引号 + 圆环"。

  几何校准：
    - S 的竖直跨度 y=62…178，中心 y=120；水平跨度 x=84…156，中心 x=120 ——
      严格居中，四周留白均衡（上下各约 62/62，左右各约 84/84）。

  规范：
    - 主色 #4F46E5 → #7C3AED 渐变，与 React 19 / Tailwind v4 生态协调。
    - 纯矢量、无损缩放。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-label="ScholarHUB logo">
  <defs>
    <linearGradient id="sh-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
  </defs>

  <!-- 背景圆角方块 -->
  <rect x="0" y="0" width="240" height="240" rx="52" ry="52" fill="url(#sh-bg)"/>

  <!-- S 形连续曲线，垂直 / 水平均居中于 (120,120) -->
  <path d="M 154 86
           C 154 68 139 62 120 62
           C 99 62 86 73 86 90
           C 86 106 99 114 120 120
           C 141 126 154 134 154 150
           C 154 167 141 178 120 178
           C 101 178 86 172 86 154"
        fill="none" stroke="#FFFFFF" stroke-width="17"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
