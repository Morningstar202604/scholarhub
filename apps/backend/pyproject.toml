[project]
name = "scholarhub-backend"
version = "0.2.0"
description = "ScholarHUB backend — modular multi-tenant academic platform base"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "ScholarHUB Contributors" }]
dependencies = [
    "fastapi[standard]>=0.115,<1.0.0",
    "uvicorn[standard]>=0.32,<1.0.0",
    "sqlalchemy[asyncio]>=2.0.36,<3.0.0",
    "asyncpg>=0.30,<1.0.0",
    "alembic>=1.14,<2.0.0",
    "pydantic[email]>=2.11,<3.0.0",
    "pydantic-settings>=2.6,<3.0.0",
    "PyJWT>=2.8,<3.0.0",
    "bcrypt>=4.0,<6.0.0",
    "structlog>=25.1,<27.0.0",
    "httpx>=0.28,<1.0.0",
    "h2>=4.4.1",
    "tenacity>=9.1,<10.0.0",
    "authlib>=1.3,<2.0.0",
    "bibtexparser>=1.4,<3.0.0",
    "rispy>=0.10,<1.0.0",
    "pyotp>=2.9,<3.0.0",
    "webauthn>=2.0,<4.0.0",
    "defusedxml>=0.7,<1.0.0",
    "prometheus-client>=0.21,<1.0.0",
    "cryptography>=50.0.0",
]

[project.optional-dependencies]
# 可选：错误监控。不安装也能正常运行 —— app/core/monitoring.py 对
# ImportError 有降级处理，未配置 DSN 时更是完全不 import。
# 启用：uv sync --extra monitoring
monitoring = [
    "sentry-sdk[fastapi]>=2.20,<3.0.0",
]
# 可选：全文搜索。未配置 SCHOLARHUB_MEILISEARCH_URL 时目录搜索走内置
# DB ILIKE；配置后由 Meilisearch 提供容错拼写 + 相关性排序。
# 启用：uv sync --extra search
search = [
    "meilisearch-python-sdk>=4.0,<8.0.0",
]
# 可选：S3 兼容对象存储（AWS S3 / MinIO / R2 / OSS）。默认 local
# 文件系统零依赖；SCHOLARHUB_STORAGE_BACKEND=s3 时需要本组。
# 启用：uv sync --extra s3
s3 = [
    "boto3>=1.35,<2.0.0",
]

[dependency-groups]
dev = [
    "ruff>=0.8,<1.0.0",
    "mypy>=1.13,<3.0.0",
    "pytest>=8.3,<10.0.0",
    "pytest-asyncio>=0.24,<2.0.0",
    "pytest-cov>=6.0,<8.0.0",
    "pytest-xdist>=3.6,<4.0.0",
    "aiosqlite>=0.20,<1.0.0",
    "asgi-lifespan>=2.1,<3.0.0",
    "pip-audit>=2.7,<3.0.0",
    "pip-licenses>=5.0,<6.0.0",
    "bandit[toml]>=1.7,<2.0.0",
    "fakeredis[lua]>=2.0,<3.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# --strict-markers: 拼错的 marker 直接报错而不是静默通过（测试被误跳过是
# 最难发现的一类"假绿"）。
# addopts 里不放 -n：本地默认串行，CI 用 `-n auto` 显式并行。
addopts = "--strict-markers --strict-config"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.coverage.run]
source = ["app"]
branch = true
# SQLAlchemy async 用 greenlet 执行同步 DBAPI 调用；不声明 concurrency，
# coverage 的 tracer 会在 greenlet 切回后丢帧，导致 async 处理函数在
# 第一个 await 之后的整段代码被误判为"未覆盖"（实测 review/routes.py 虚低 20+ 个点）。
concurrency = ["greenlet", "thread"]
# 迁移脚本与 E2E 引导脚本不是被测对象
omit = [
    "*/alembic/*",
    "*/tests/*",
    "e2e_run_server.py",
    "app/modules/*/models.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "RUF"]
# B008: FastAPI 的 Depends/Query 在默认参数中调用是官方推荐模式
# RUF001/002/003: 中文 docstring/注释/字符串中的全角标点（（）等）被标为歧义，
#                 但项目允许中文注释，这些是中文标点正常用法
ignore = ["E501", "B008", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B017"]  # 允许测试中对 Exception 通用断言
# E402: 该脚本必须在 import app 之前设置环境变量（config 在 import 时读取 env），
# import 后置是刻意设计，非疏漏。
"e2e_run_server.py" = ["E402"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

# 第三方库无 py.typed / stubs —— 跳过类型检查（仅在 import 处忽略）
[[tool.mypy.overrides]]
module = ["bibtexparser.*", "rispy.*"]
ignore_missing_imports = true

# 运行时可选的集成依赖（Redis / S3 / Meilisearch）不一定随测试安装，
# 且均无 py.typed 类型标注，允许缺失 stub 并放宽其返回类型
[[tool.mypy.overrides]]
module = ["redis", "redis.*", "boto3", "boto3.*", "meilisearch_python_sdk", "meilisearch_python_sdk.*", "defusedxml"]
ignore_missing_imports = true
follow_untyped_imports = true

[tool.bandit]
exclude_dirs = ["tests", "alembic"]
level = "MEDIUM"
confidence = "MEDIUM"

[tool.bandit.assert_used]
skips = ["app/core/config.py"]
